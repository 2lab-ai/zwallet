name: Preview

# Publishes a prerelease `preview-<YYYY-MM-DD-HHMM>-<sha12>` with 4 binaries
# + SHA256SUMS on every push to main (and on demand). The tap derives the
# zwallet-preview brew version (YYYY.MM.DD.HHMM) from this tag, so the tag format
# is load-bearing. The tap pulls new releases on its own schedule
# (homebrew-tap bump.yml `bump-zwallet-preview`), so this workflow holds no tap
# credential and pushes nothing to the tap.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: preview-publish
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build_id: ${{ steps.plan.outputs.build_id }}
      tag: ${{ steps.plan.outputs.tag }}
      commit: ${{ steps.plan.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute build identity
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=12 HEAD)"
          stamp="$(date -u +%Y-%m-%d-%H%M)"
          build_id="$stamp-$short_sha"
          {
            echo "commit=$commit"
            echo "build_id=$build_id"
            echo "tag=preview-$build_id"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            name: zwallet-macos-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: zwallet-macos-x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: zwallet-linux-x86_64
          # Native arm64 runner (free for public repos) — no cross/zigbuild needed.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            name: zwallet-linux-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # `zwallet --version` = `zwallet <ver> (<channel> <rev12>)` (src/lib.rs version_line).
      # ZWALLET_BUILD_ID is a revision (first 12 chars kept), so it gets the commit
      # sha, not the build_id: the build_id leads with the timestamp.
      ZWALLET_BUILD_CHANNEL: preview
      ZWALLET_BUILD_ID: ${{ needs.preflight.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: preview-${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # The linker signs only arm64 output, and `unlock` refuses a zwallet build that has no
      # code signature (src/core/protocol.rs check_started_code compares the daemon's cdhash
      # with its own). So every macOS binary is ad-hoc signed here, with the hardened runtime,
      # under which dyld ignores DYLD_* variables such as DYLD_INSERT_LIBRARIES.
      # First the control: unsigned for the runtime, the binary obeys DYLD_INSERT_LIBRARIES
      # (dyld aborts on the missing library), so the check after signing is not vacuous.
      - name: DYLD_INSERT_LIBRARIES reaches the binary before signing
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # The run must fail, and because dyld could not load the inserted library (dyld4:
          # "terminating because inserted dylib '…' could not be loaded"; dyld3: "could not load
          # inserted library '…'"): any other failure proves nothing about dyld.
          if err="$(DYLD_INSERT_LIBRARIES=/nonexistent/x.dylib "target/$TARGET/release/zwallet" --version 2>&1 >/dev/null)"; then
            echo "::error::dyld ignored DYLD_INSERT_LIBRARIES before signing; the hardened-runtime check would prove nothing"
            exit 1
          fi
          if ! grep -Eq "inserted (dylib|library) '/nonexistent/x\.dylib'" <<<"$err"; then
            echo "::error::the unsigned run failed, but not on the inserted library: $err"
            exit 1
          fi
          head -n 1 <<<"$err"

      - name: Sign macOS binary (ad-hoc, hardened runtime)
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bin="target/$TARGET/release/zwallet"
          codesign --force --sign - --options runtime "$bin"
          codesign --verify --strict "$bin"
          info="$(codesign -dv "$bin" 2>&1)"
          echo "$info"
          if ! grep -Eq '^CodeDirectory .*flags=0x[0-9a-f]+\([^)]*runtime[^)]*\)' <<<"$info"; then
            echo "::error::$bin is not signed with the hardened runtime"
            exit 1
          fi

      # The x86_64 binary cannot run on this arm64 runner without Rosetta; its flags are checked
      # in the signing step above.
      - name: Hardened runtime ignores DYLD_INSERT_LIBRARIES
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          commit="$(git rev-parse HEAD)"
          expected="zwallet $version (preview ${commit:0:12})"
          actual="$(DYLD_INSERT_LIBRARIES=/nonexistent/x.dylib "target/$TARGET/release/zwallet" --version)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::with DYLD_INSERT_LIBRARIES set: expected '$expected', got '$actual'"
            exit 1
          fi
          echo "$actual"

      # Exact version line of the shipped binary, expected from sources independent of
      # the build env: channel literal, Cargo.toml version, checked-out commit. Every
      # target runs on its own runner except x86_64-apple-darwin (cross-built on arm64).
      - name: Smoke-test version line
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          commit="$(git rev-parse HEAD)"
          expected="zwallet $version (preview ${commit:0:12})"
          actual="$("target/$TARGET/release/zwallet" --version)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::version line mismatch: expected '$expected', got '$actual'"
            exit 1
          fi
          echo "$actual"

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          cp "target/${{ matrix.target }}/release/zwallet" "${{ matrix.name }}"
          if [ "${{ runner.os }}" = "Linux" ]; then
            sha256sum "${{ matrix.name }}" > "${{ matrix.name }}.sha256"
          else
            shasum -a 256 "${{ matrix.name }}" > "${{ matrix.name }}.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}
            ${{ matrix.name }}.sha256

  publish:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Assemble release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          for asset in zwallet-macos-aarch64 zwallet-macos-x86_64 zwallet-linux-x86_64 zwallet-linux-aarch64; do
            cp "artifacts/$asset/$asset" "release/$asset"
          done
          (cd release && sha256sum zwallet-* > SHA256SUMS)
          cat release/SHA256SUMS
          {
            echo "Preview build \`${{ needs.preflight.outputs.build_id }}\` from ${{ needs.preflight.outputs.commit }}."
            echo
            echo "Install: \`brew install 2lab-ai/tap/zwallet-preview\`"
            echo
            echo '```'
            cat release/SHA256SUMS
            echo '```'
          } > PREVIEW_NOTES.md

      - name: Create preview prerelease
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          name: Preview build ${{ needs.preflight.outputs.build_id }}
          body_path: PREVIEW_NOTES.md
          prerelease: true
          make_latest: false
          target_commitish: ${{ needs.preflight.outputs.commit }}
          files: |
            release/zwallet-macos-aarch64
            release/zwallet-macos-x86_64
            release/zwallet-linux-x86_64
            release/zwallet-linux-aarch64
            release/SHA256SUMS

      - name: Prune old preview prereleases (keep 15)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease,createdAt > preview-releases.json
          python3 - <<'PY' > old-preview-tags.txt
          import json
          with open("preview-releases.json", encoding="utf-8") as handle:
              data = json.load(handle)
          releases = [
              release for release in data
              if release.get("isPrerelease") and str(release.get("tagName", "")).startswith("preview-")
          ]
          releases.sort(key=lambda release: str(release.get("createdAt", "")), reverse=True)
          for release in releases[15:]:
              print(release["tagName"])
          PY
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done < old-preview-tags.txt
