<script>
const $=id=>document.getElementById(id),clamp=x=>Math.max(0,Math.min(1,x));
const ease=x=>{x=clamp(x);return x*x*(3-2*x)},fade=(id,a)=>$(id).setAttribute('opacity',clamp(a));
const between=(t,a,b,d=.45)=>ease((t-a)/d)*ease((b-t)/d);
const ko=new URLSearchParams(location.search).get('lang')==='ko';
const tr=(a,b)=>ko?a:b,txt=(id,a,b)=>$(id).textContent=tr(a,b);
document.documentElement.lang=ko?'ko':'en';
$('scene').setAttribute('aria-label',tr('에이전트에게 작업비를 맡기고, 지갑의 규칙으로 결제를 제어하고, 결과를 받는 흐름','Fund your agent, control payments with wallet rules, and receive the results'));
const labels={you:['나','You'],agent:['내 에이전트','Your agent'],payee:['결제 테스트','Payment test']};
for(const [id,label] of Object.entries(labels))$(id).querySelector('text').textContent=tr(...label);
const receiptTexts=$('receipt').querySelectorAll('text');
['결제 테스트 완료|Payment test complete','결제|Payment','2 USDT|2 USDT','네트워크 수수료|Network fee','0.00002 ETH|0.00002 ETH','남은 작업비|Funds left','48 USDT + 0.00998 ETH|48 USDT + 0.00998 ETH'].forEach((x,i)=>receiptTexts[i].textContent=tr(...x.split('|')));
txt('future-service','서비스 결제','Services');txt('future-service-sub','필요한 API와 도구','APIs and tools');
txt('future-buy','물건 구매','Shopping');txt('future-buy-sub','내가 요청한 상품','Items you ask for');
txt('future-invest','투자 실행','Investing');txt('future-invest-sub','내가 정한 투자 지시','Your investment mandate');
txt('future-note','미래 연동 구상 · 아직 구현되지 않았습니다.','Future integrations · Not implemented yet.');
$('balance').querySelector('text').textContent=tr('작업용 지갑','Task wallet');
const paths=['fund','req','pay','result','task','report'],lengths={};
for(const key of paths)lengths[key]=$(key+'-light').getTotalLength();
function pulse(key,p,span=75){const node=$(key+'-light'),n=lengths[key],pos=clamp(p)*n;node.setAttribute('stroke-dasharray',`${span} ${n+span}`);node.setAttribute('stroke-dashoffset',String(span-pos));fade(key+'-light',p>0&&p<1?ease(p/.12)*ease((1-p)/.12):0);return node.getPointAtLength(pos);}
const headings=[
 [0,'작업비를 맡기면, 일은 에이전트가.','Fund the task. Your agent does the work.','“결제 기능 만들고, 테스트까지 끝내줘.”','“Build the payment flow. Test it end to end.”'],
 [11.3,'내가 받는 건, 결과와 사용 내역.','Get the result. And the receipts.','돈 보내고, 결제하고, 확인하러 돌아오지 않도록.','Your agent handles the payment, verifies it, and reports back.'],
 [14.5,'정한 선을 넘으면, 여기서 멈춤.','Over the limit? It stops here.','1회 한도는 5 USDT. 20 USDT 요청은 서명하지 않습니다.','A 5 USDT limit per payment. A 20 USDT request gets no signature.'],
 [20,'접근 종료도, 내가 정합니다.','You decide when access ends.','시간이 만료되거나 내가 잠그면, 새 서명은 종료.','When access expires or you lock the wallet, new signing stops.'],
 [24.5,'그다음은, 에이전트가 할 수 있는 일들.','A wallet for what agents do next.','내가 지시한 서비스 결제, 구매, 투자로 이어질 수 있도록.','Services, purchases and investing, under your instructions.'],
 [32,'내 에이전트. 내 돈. 내가 정한 규칙.','Your agent. Your money. Your rules.','오픈소스 지갑. 내 기기의 키. zwallet 서비스 가입 없이.','Open source. Keys on your device. No zwallet service signup.']
];
window.duration=36;
window.draw=t=>{
 t=Math.max(0,Math.min(window.duration,t));
 const future=ease((t-24.5)/1.25),denied=between(t,16.5,20.1,.4),locked=between(t,21.5,24.9,.4);
 let p=t<19?(t-1.25)/2:(t-20.3)/1.2;
 let point=pulse('fund',p);$('fund-label').setAttribute('transform',`translate(${point.x} ${point.y-35})`);
 $('fund-label').querySelector('text').textContent=t<19?'50 USDT + 0.01 ETH':tr('잠금','Lock');
 fade('fund-pulse',t<19?between(t,1,3.8,.35):between(t,20.2,22,.3));
 p=t<14?(t-4.2)/1.4:t<20?(t-15)/1.5:(t-22.15)/.9;
 point=pulse('req',p,48);$('req-label').setAttribute('transform',`translate(${point.x} ${point.y-87})`);
 $('req-label').querySelector('text').textContent=t>=14&&t<20?'20 USDT':'2 USDT';
 fade('req-pulse',t<14?between(t,4,5.9,.25):t<20?between(t,14.85,16.9,.3):between(t,22.05,23.4,.3));
 point=pulse('pay',(t-7.4)/1.3,65);$('pay-dot').setAttribute('cx',point.x);$('pay-dot').setAttribute('cy',point.y);fade('pay-pulse',between(t,7.4,8.9,.25));
 pulse('result',(t-9.1)/1.2,110);pulse('report',(t-10.5)/.8,50);pulse('task',(t-.3)/.75,50);
 const active=between(t,.6,11.3,.4)+between(t,14.9,16.7,.3)+between(t,22.1,23.2,.3);
 fade('agent-ring',active*(.22+.28*(.5+.5*Math.sin(t*3))));fade('wallet-ring',between(t,5.5,7.4,.3)*(.45+.35*Math.sin(t*5)**2)+denied*.5+locked*.5);
 fade('balance',between(t,3.4,5.6,.5));
 fade('rules',between(t,5.5,8.2,.45));
 txt('rule-text',t<6.2?'수취인 확인':t<6.8?'1회 5 USDT 이내':'남은 접근 시간 28분',t<6.2?'Allowed recipient':t<6.8?'5 USDT max per payment':'Access expires in 28 min');
 fade('rule-check',ease((t-5.8)/.2));
 fade('payee-check',ease((t-8.7)/.45));fade('payee-icon',1-ease((t-8.7)/.45));
 fade('receipt',between(t,11.3,14.9,.65));$('receipt').setAttribute('transform',`translate(470 ${710+24*(1-ease((t-11.3)/.65))})`);
 fade('result-path',1-ease((t-11.3)/.5));
 fade('payee',1-future);fade('payment-path',1-future);fade('fund-path',1-future*.8);
 fade('wallet-icon',(1-denied)*(1-locked));fade('wallet-deny',denied);fade('wallet-lock',locked);
 fade('safety-note',between(t,16.5,24.7,.5));
 txt('safety-title',t<20?'서명 거절. 돈은 그대로.':'잠금 완료. 새 서명은 종료.',t<20?'Refused. Funds stay put.':'Locked. No new signatures.');
 txt('safety-body',t<20?'20 USDT 요청 > 1회 5 USDT 한도':'이미 보낸 거래를 되돌리지는 않습니다.',t<20?'20 USDT requested > 5 USDT per-payment cap':'Transactions already sent are not reversed.');
 txt('safety-detail',t<20?'남은 작업비 48 USDT + 0.00998 ETH':'내 기기의 키 · 신뢰하는 기기에서 사용',t<20?'Funds left: 48 USDT + 0.00998 ETH':'Keys stay on your device · Use a trusted device');
 txt('you-status',t<3.4?'작업비와 규칙을 설정':t<11.3?'작업은 에이전트에게':t<20?'결과와 내역을 받습니다':t<24.5?'내가 접근을 종료':'목표와 규칙은 내가',t<3.4?'Set funds and rules':t<11.3?'Delegate the work':t<20?'Results and receipts':t<24.5?'End signing access':'Your goals and rules');
 txt('agent-status',t<4.2?'결제 기능 테스트 중':t<8.8?'허용된 결제 실행 중':t<11.3?'완료 내역 정리 중':t<14.8?'보고 완료':t<20?'20 USDT 결제 요청':t<24.5?'새 요청은 진행 불가':'내 지시를 실행',t<4.2?'Testing the payment flow':t<8.8?'Making an allowed payment':t<11.3?'Preparing the report':t<14.8?'Reported':t<20?'Requests 20 USDT':t<24.5?'New request cannot proceed':'Acts on your instructions');
 txt('wallet-status',t<5.5?'내가 정한 규칙':t<7.4?'요청 검사 중':t<9?'규칙 안에서 승인':t<16.5?'48 USDT 남음':t<20?'한도 초과 · 서명 거절':t<21.5?'접근 종료 요청':t<24.5?'잠금':'내 기기의 키와 규칙',t<5.5?'Your rules':t<7.4?'Checking the request':t<9?'Allowed by your rules':t<16.5?'48 USDT remaining':t<20?'Over limit · Refused':t<21.5?'Ending access':t<24.5?'Locked':'Local keys and policy');
 txt('payee-status',t<8.7?'허용한 수취인':t<14.9?'2 USDT 결제 확인':'추가 결제 없음',t<8.7?'An allowed recipient':t<14.9?'2 USDT confirmed':'No additional payment');
 fade('future',future);fade('closing-url',ease((t-32.7)/.8));
