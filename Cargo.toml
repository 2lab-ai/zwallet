[package]
name = "zwallet"
version = "0.1.0"
edition = "2024"
description = "Local, login-free wallet CLI for agents (EVM; human unlock, key-only daemon)"
license = "MIT"
publish = false

[lib]
name = "zwallet"
path = "src/lib.rs"

[[bin]]
name = "zwallet"
path = "src/main.rs"

[dependencies]
alloy = { version = "2.5", features = ["signer-mnemonic", "consensus", "network", "rlp", "eips", "sol-types", "dyn-abi", "json-abi", "k256"] }
aes-gcm = "0.10"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29.0"
ed25519-dalek = { version = "2.2", features = ["zeroize"] }
libc = "0.2"
qrcode = { version = "=0.14.1", default-features = false }
rand = "0.8"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
scrypt = { version = "0.11", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "time", "net", "io-util", "signal", "sync"] }
zeroize = { version = "1", features = ["serde"] }

[dev-dependencies]
rqrr = { version = "=0.11.0", default-features = false }
tempfile = "3"

# The KDF runs in every invocation; keep it fast in the debug builds the tests use.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
